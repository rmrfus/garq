[project]
name = "garq"
version = "0.1.0"
description = "Garmin Connect stats fetcher for LLM skill use"
requires-python = ">=3.11"

dependencies = ["garminconnect", "keyring"]

[dependency-groups]
dev = ["ruff", "ty", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ty.environment]
python-version = "3.11"
